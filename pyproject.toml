[project]
name = "meds-model-template"
version = "0.2.0"
description = "A minimal, contract-first Copier template for MEDS model repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["copier>=9"]

[dependency-groups]
dev = ["polars>=1", "pyarrow>=15", "pytest>=8", "pyyaml>=6", "ruff"]
# MkDocs 2.0 removes the plugin and theme systems Material depends on, so stay on 1.x.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
