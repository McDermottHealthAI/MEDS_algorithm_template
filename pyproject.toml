[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meds-algorithm-template"
version = "0.4.0a2"
description = "A minimal, contract-first Copier template for MEDS algorithm repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["copier>=9.17.1,<10", "pyyaml>=6"]

[project.scripts]
meds-algorithm-template = "meds_algorithm_template.cli:main"

[project.urls]
Repository = "https://github.com/McDermottHealthAI/MEDS_algorithm_template"
Documentation = "https://meds-algorithm.readthedocs.io/en/latest/"

[tool.hatch.build.targets.wheel]
packages = ["src/meds_algorithm_template"]

[dependency-groups]
dev = ["meds-algorithm[conformance,orchestration]==0.4.0a5", "polars>=1", "pyarrow>=15", "pytest>=8", "pyyaml>=6", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
