[project]
name = "meds-model-template"
version = "0.3.0"
description = "A minimal, contract-first Copier template for MEDS model repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["copier>=9.17.1"]

[dependency-groups]
dev = ["meds-model-core[data] @ git+https://github.com/florian6973/meds-model-core.git@5599c0925f9361057b2ef396c57eb8a194928c1a", "polars>=1", "pyarrow>=15", "pytest>=8", "pyyaml>=6", "ruff"]
# MkDocs 2.0 removes the plugin and theme systems Material depends on, so stay on 1.x.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
