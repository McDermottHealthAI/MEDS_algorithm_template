name: Documentation redirects

# The full site is maintained in meds-algorithm and hosted on Read the Docs.
# Keep Pages enabled to redirect existing bookmarks, including page fragments.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_docs_redirects.py
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-redirects

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
