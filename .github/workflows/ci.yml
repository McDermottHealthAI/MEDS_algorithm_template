name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check src tests scripts docs/hooks.py
      - run: uv run ruff format --check src tests scripts docs/hooks.py
      - run: uv run pytest -q
      - run: uv build
      - run: uvx --from 'twine>=6' twine check --strict dist/*
      - name: Verify the installed generator and canonical Copier update source
        run: |
          uv venv /tmp/template-wheel
          uv pip install --python /tmp/template-wheel/bin/python dist/*.whl
          /tmp/template-wheel/bin/python -I tests/wheel_smoke.py "$PWD"
